# .github/workflows/mcp-grade.yml
name: mcp-grade
on:
  push:
    paths:
      - src
  pull_request:
    paths:
      - src
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: lipon101/mcp-grade@0752a8ae31d2093acd0753ec6cec46ff10ea9656
        id: scan
        with:
          fail-under: C
      - name: Show grade
        if: always()
        run: echo "Grade ${{ steps.scan.outputs.grade }} (${{ steps.scan.outputs.score }}/100)"
